name: AUSTRIQ Claude Code v1.1.0 - owner-approved issue effort

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: austriq-claude-${{ github.repository }}-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == 'chrisoesterreichprog' &&
      github.event.issue.pull_request == null &&
      github.event.issue.number == 1 &&
      (startsWith(github.event.comment.body, '@claude [model:opus] [effort:medium]') || startsWith(github.event.comment.body, '@claude [model:opus] [effort:high]') || startsWith(github.event.comment.body, '@claude [model:opus] [effort:xhigh]'))
    # Hostinger is enabled only after a repository-scoped runner is registered
    # and the owner sets AUSTRIQ_CLAUDE_RUNNER=hostinger for this repository.
    # Otherwise preserve the original GitHub-hosted behavior.
    # Owner-only Opus/xhigh; Hostinger-only (no hosted fallback)
    runs-on: [self-hosted, Linux, X64, austriq-hostinger]
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout immutable dispatch policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate AUSTRIQ 11 sections and issue effort and model
        id: route
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISPATCH_COMMENT: ${{ github.event.comment.body }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = os.environ.get('ISSUE_BODY', '')
          lines = os.environ.get('DISPATCH_COMMENT', '').splitlines()
          header = lines[0].strip() if lines else ''
          match = re.fullmatch(r'@claude \[model:(opus|fable)\] \[effort:(medium|high|xhigh)\]', header)
          if not match:
              sys.exit('::error::Only opus/fable xhigh owner dispatch is allowed')
          required = [
            'Strategisches Gesamtziel', 'Konkretes Ziel',
            'Technischer Kontext', 'Scope', 'Aufwandsschätzung',
            'Sicherheitsrestriktionen', 'Umsetzungsschritte',
            'Definition of Done', 'Reproduzierbare Tests',
            'Rollbackstrategie', 'Fortschritt in Prozent'
          ]
          if 'AUSTRIQ-CLAUDE-TASK v1.1.0' not in body or any(x not in body for x in required):
              sys.exit('::error::Missing AUSTRIQ v1.1.0 issue sections')
          model = {'opus':'claude-opus-5-5', 'fable':'claude-fable-5-2'}[match.group(1)]
          if model not in body:
              sys.exit('::error::Owner model does not match issue route')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as file:
              file.write(f'model={model}\neffort={match.group(2)}\n')
          print(f'Model route: {model}, effort: {match.group(2)}, no API fallback')
          PY
      - name: Check OAuth token only
        shell: bash
        env:
          CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_AUTH" ]; then
            echo "::error::Missing CLAUDE_CODE_OAUTH_TOKEN in this repository; no paid key fallback."
            exit 1
          fi
      - name: Checkout DEV baseline
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
      - name: Verify safe repository baseline
        run: |
          test -f README.md
          test -f CLAUDE.md
          test "$(git branch --show-current)" = "dev"
          git status --short
      # Owner-only, fail-closed binding of CLI effort to the current issue policy.
      - name: Enforce exact issue-approved Opus effort
        id: effort_policy
        env:
          ROUTING_COMMENT: ${{ github.event.comment.body }}
          ROUTING_ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          lines = os.environ.get('ROUTING_COMMENT', '').splitlines()
          first = lines[0].strip() if lines else ''
          m = re.fullmatch(r'@claude \[model:opus\] \[effort:(medium|high|xhigh)\]', first)
          body = os.environ.get('ROUTING_ISSUE_BODY', '')
          markers = re.findall(r'(?m)^<!-- AUSTRIQ_EFFORT_ROUTING_20261120 model=claude-opus-5-5 effort=(medium|high|xhigh) -->$', body)
          if not m or markers != [m.group(1)]:
              sys.exit('::error::No exact owner-approved issue effort marker; refuse dispatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('effort=' + m.group(1) + '\n')
          print('Approved model claude-opus-5-5, effort ' + m.group(1))
          PY
      - name: Execute Claude Code with OAuth
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: dev
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --effort ${{ steps.effort_policy.outputs.effort }}
            --max-turns 300
            --permission-mode acceptEdits
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python3:*),Bash(pytest:*),Bash(mkdir:*),Bash(ls:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
