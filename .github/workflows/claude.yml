name: AustriQ Claude Code - owner-only Opus 5.5 dynamic effort

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: austriq-claude-${{ github.repository }}-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == 'chrisoesterreichprog' &&
      github.event.issue.pull_request == null &&
      github.event.issue.number == 1 &&
      startsWith(github.event.comment.body, '@claude [model:opus] [effort:')
    # Hostinger is enabled only after a repository-scoped runner is registered
    # and the owner sets AUSTRIQ_CLAUDE_RUNNER=hostinger for this repository.
    # Otherwise preserve the original GitHub-hosted behavior.
    # Owner-only Opus/xhigh; Hostinger-only (no hosted fallback)
    runs-on: [self-hosted, Linux, X64, austriq-hostinger]
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout immutable dispatch policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact owner Opus/effort route (and all 11 issue sections)
        id: route
        shell: bash
        env:
          TASK_COMMENT: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PYCODE'
          import os, re, sys
          def fail(reason):
              sys.exit('::error::' + reason)
          comment=(os.environ.get('TASK_COMMENT') or '').splitlines()
          header=comment[0].strip() if comment else ''
          match=re.fullmatch(r'@claude \[model:opus\] \[effort:(medium|high|xhigh)\]',header)
          if not match: fail('Only one owner-selected Opus 5.5 medium/high/xhigh route is accepted')
          chosen=match.group(1)
          body=os.environ.get('ISSUE_BODY') or ''
          if 'AUSTRIQ-CLAUDE-TASK v1.1.0' not in body:fail('Missing AUSTRIQ v1.1.0 issue standard')
          sections=list(re.finditer(r'(?m)^##\s+(\d+)\.\s+.+$',body))
          if [int(m.group(1)) for m in sections]!=list(range(1,12)):
              fail('Eleven numbered issue sections are required')
          section5=body[sections[4].end():sections[5].start()]
          if 'claude-opus-5-5' not in section5:fail('Issue must explicitly declare the Opus 5.5 model')
          owner=re.search(r'(?i)Owner-Routing vom 20\.11\.2026[^\n]*Modell:\s*`?claude-opus-5-5`?\s*;\s*Effort:\s*`?(medium|high|xhigh)\b',section5)
          raw=re.findall(r'(?i)<!--\s*AUSTRIQ_EFFORT_ROUTING_20261120\b([^>]*?)-->',section5)
          parsed=[re.fullmatch(r'\s+model=claude-opus-5-5\s+effort=(medium|high|xhigh)\s*',x,re.I) for x in raw]
          if len(parsed)>1 or any(x is None for x in parsed):fail('Invalid or duplicate owner route marker')
          if owner:
              if len(parsed)!=1 or parsed[0].group(1).lower()!=owner.group(1).lower():
                  fail('Owner route marker contradicts selected effort')
              expected=owner.group(1).lower()
          elif raw:
              fail('Owner marker without matching section 5 instruction')
          else:
              approved=re.findall(r'(?i)Verbindliches Modellrouting \(Owner, 20\.11\.2026\):\s*Modell:\s*`?claude-opus-5-5`?\s*;\s*Effort:\s*`?(medium|high|xhigh)\b',section5)
              values={x.lower() for x in approved} if approved else {x.lower() for x in re.findall(r'(?i)\bEffort\s*:\s*[\x60*]*\s*(medium|high|xhigh)\b',section5)}
              if len(values)!=1:fail('Missing or contradictory issue effort declaration')
              expected=next(iter(values))
          if expected!=chosen:fail('Dispatch effort does not match owner-approved issue effort')
          turns={'medium':80,'high':160,'xhigh':300}[chosen]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'model=claude-opus-5-5\neffort={chosen}\nmax_turns={turns}\n')
          print(f'Validated model claude-opus-5-5, effort {chosen} against issue section 5')
          PYCODE
      - name: Check OAuth token only
        shell: bash
        env:
          CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_AUTH" ]; then
            echo "::error::Missing CLAUDE_CODE_OAUTH_TOKEN in this repository; no paid key fallback."
            exit 1
          fi
      - name: Checkout DEV baseline
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
      - name: Verify safe repository baseline
        run: |
          test -f README.md
          test -f CLAUDE.md
          test "$(git branch --show-current)" = "dev"
          git status --short
      - name: Execute Claude Code with OAuth
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: dev
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --effort ${{ steps.route.outputs.effort }}
            --max-turns 300
            --permission-mode acceptEdits
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python3:*),Bash(pytest:*),Bash(mkdir:*),Bash(ls:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
